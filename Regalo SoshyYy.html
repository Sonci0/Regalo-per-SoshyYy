<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te Iubesc SoshyYy</title>
<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html,body{ height:100%; margin:0; background:#000; overflow:hidden; }
  canvas{ display:none; width:100vw; height:100vh; background:#000; }

  #terminal{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
    font-family:'Courier New', monospace;
    padding:20px;
  }
  #termBox{
    max-width:520px; width:100%;
    line-height:1.7;
    font-size:15px;
    color:#8fe3a3;
  }
  #termBox .line{ opacity:0; transform:translateY(4px); animation:fadeIn .4s forwards; }
  #termBox .sys{ color:#8fe3a3; }
  #termBox .ready{ color:#5be86a; font-weight:bold; }
  #termBox .msg{ color:#ff6fa3; font-style:italic; }
  @keyframes fadeIn{ to{ opacity:1; transform:translateY(0); } }

  #decryptBtn{
    margin-top:22px;
    display:inline-flex; align-items:center; gap:10px;
    background:transparent;
    border:1.5px solid #ff2d6b;
    color:#ff2d6b;
    padding:10px 18px;
    font-family:'Courier New', monospace;
    font-size:14px;
    letter-spacing:1px;
    border-radius:6px;
    cursor:pointer;
    opacity:0;
    animation:fadeIn .4s forwards;
    animation-delay:1.8s;
    box-shadow:0 0 10px rgba(255,45,107,0.25);
    transition:background .2s, color .2s, box-shadow .2s;
  }
  #decryptBtn:hover{
    background:rgba(255,45,107,0.12);
    box-shadow:0 0 18px rgba(255,45,107,0.5);
  }

  #terminal.hide{ animation:fadeOut .6s forwards; }
  @keyframes fadeOut{ to{ opacity:0; visibility:hidden; } }

  canvas.show{ display:block; }
</style>
</head>
<body>

<div id="terminal">
  <div id="termBox">
    <div class="line sys" style="animation-delay:.1s">[system] Initializing heart.PROTOCOL_v2.0 ...</div>
    <div class="line" style="animation-delay:.6s">[status] <span class="ready">READY</span></div>
    <div class="line msg" style="animation-delay:1.2s">&gt; Un messaggio cryptato individuato.</div>
    <button id="decryptBtn">🔒 DECRYPT MESSAGE</button>
  </div>
</div>

<canvas id="c"></canvas>
<script>
document.getElementById('decryptBtn').addEventListener('click', () => {
  const term = document.getElementById('terminal');
  const canvas = document.getElementById('c');
  term.classList.add('hide');
  canvas.classList.add('show');
  setTimeout(() => { term.style.display = 'none'; }, 600);
});
</script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize);
resize();

// implicit heart shape: (x^2+y^2-1)^3 - x^2*y^3 <= 0, in normalized coords
function insideHeart(x, y){
  const v = Math.pow(x*x + y*y - 1, 3) - x*x*y*y*y;
  return v <= 0;
}

const WORD = "Te Iubesc";
const particles = [];
const N = 420;
const RANGE = 1.3; // bounding box half-size in normalized coords

let count = 0, tries = 0;
while(count < N && tries < N*200){
  tries++;
  const x = (Math.random()*2 - 1) * RANGE;
  const yRaw = (Math.random()*2 - 1) * RANGE;
  if(insideHeart(x, yRaw)){
    count++;
    particles.push({
      baseX: x * 13,
      baseY: -yRaw * 13, // flip: implicit formula points "up" already, keep orientation consistent
      phase: Math.random()*Math.PI*2,
      speed: 0.6 + Math.random()*1.4,
      size: 8 + Math.random()*7,
      twinkleSpeed: 0.5 + Math.random()*2.2,
      hue: Math.random() < 0.15 ? 350 : 355
    });
  }
}

let startTime = performance.now();

function draw(now){
  const t = (now - startTime)/1000;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,H);

  const scale = Math.min(W,H) / 34 * (1 + 0.035*Math.sin(t*2.2)); // heartbeat pulse
  const cx = W/2, cy = H/2 + Math.min(W,H)*0.03;

  for(const p of particles){
    const twinkle = 0.35 + 0.65 * (0.5 + 0.5*Math.sin(t*p.twinkleSpeed + p.phase));
    const x = cx + p.baseX*scale;
    const y = cy + p.baseY*scale;

    ctx.save();
    ctx.globalAlpha = twinkle;
    ctx.font = `${p.size}px 'Courier New', monospace`;
    ctx.fillStyle = `hsl(${p.hue}, 90%, ${45 + twinkle*25}%)`;
    ctx.shadowColor = `hsl(${p.hue}, 100%, 55%)`;
    ctx.shadowBlur = 8*twinkle;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(WORD, x, y);
    ctx.restore();
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
